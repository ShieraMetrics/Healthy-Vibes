<!DOCTYPE html>
<html lang="en-IE" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shiera's Health App">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Shiera's Health App</title>
<style>
:root{
  --bg:#f4f1ea;--bg2:#ebe7de;--card:#ffffff;--ink:#1b2325;--ink2:#3d4749;--mute:#6f7977;--line:#e4dfd4;--shadow:0 1px 3px rgba(30,30,20,.06),0 6px 18px rgba(30,30,20,.05);
  --green:#1a9a71;--green-ink:#0f6b4e;--green-soft:#dff3ea;
  --amber:#c7811a;--amber-ink:#8a5606;--amber-soft:#fbeed6;
  --red:#c6433d;--red-ink:#93302b;--red-soft:#fae3e1;
  --blue:#2d6ea6;--blue-ink:#1f5280;--blue-soft:#e0ecf7;
  --violet:#6a4fc4;--violet-soft:#ebe5fa;
  --ring:#e4dfd4;--r:16px;--rs:11px;
}
[data-theme=dark]{
  --bg:#12151a;--bg2:#1a1f26;--card:#1d232b;--ink:#eceae3;--ink2:#c9cbc4;--mute:#949d9a;--line:#2b333c;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.25);
  --green:#36c08f;--green-ink:#7fe0bb;--green-soft:#173529;
  --amber:#e3a23a;--amber-ink:#f0c57a;--amber-soft:#3a2d13;
  --red:#e3645e;--red-ink:#f39b96;--red-soft:#3d1f1d;
  --blue:#6ca5de;--blue-ink:#9cc3ea;--blue-soft:#1b2a3a;
  --violet:#a48ae8;--violet-soft:#2a2340;
  --ring:#2b333c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-bottom:140px}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--green-ink)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.appname{font-weight:800;font-size:18px;letter-spacing:-.01em}
.hr{display:flex;align-items:center;gap:10px}
.wk{font-size:12.5px;color:var(--mute);text-align:right;line-height:1.2}
.wk b{color:var(--green-ink);font-size:13.5px}
.theme{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;display:flex;align-items:center;justify-content:center}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;min-height:56px;padding:7px 0 8px;font-size:10.5px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
nav.tabs button .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.75}
nav.tabs button.on{color:var(--green-ink)}
nav.tabs button.on .ic{filter:none;opacity:1}
.page{display:none}.page.on{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.sub{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;scrollbar-width:none}
.sub::-webkit-scrollbar{display:none}
.sub button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;font-size:13.5px;white-space:nowrap;min-height:40px}
.sub button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.h{font-weight:800;font-size:16px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:-.01em}
.h small{font-weight:500;color:var(--mute);font-size:12.5px}
.sh{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px}
.mute{color:var(--mute)}.small{font-size:13px}.tiny{font-size:11.5px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daynav button{border:1px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:20px}
.daynav .d{text-align:center}.daynav .d b{display:block;font-size:17px}
/* greeting */
.greet{background:linear-gradient(135deg,var(--green) 0%,#167a5a 100%);color:#fff;border-radius:var(--r);padding:18px 16px;margin-bottom:12px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow)}
[data-theme=dark] .greet{background:linear-gradient(135deg,#1f8a67 0%,#145a43 100%)}
.greet .txt{flex:1;min-width:0}
.greet .hi{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:3px}
.greet .ln{font-size:14px;opacity:.95}
.greet .ln b{font-weight:700}
.greet .ph{font-size:12px;opacity:.8;margin-top:6px}
.ring{flex:0 0 76px;width:76px;height:76px;position:relative}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:17px;line-height:1}
.ring .n small{font-size:9.5px;font-weight:600;opacity:.85;margin-top:2px}
.ring.pop svg{animation:pop .5s ease-out}
@keyframes pop{0%{transform:rotate(-90deg) scale(1)}40%{transform:rotate(-90deg) scale(1.12)}100%{transform:rotate(-90deg) scale(1)}}
.cheer{border-radius:var(--rs);padding:12px 14px;margin:-2px 0 12px;font-size:14.5px;line-height:1.4;background:var(--green-soft);color:var(--green-ink);border-left:4px solid var(--green)}
.cheer.part{background:var(--bg2);color:var(--ink2);border-left-color:var(--line)}
.banner{border-radius:var(--rs);padding:10px 13px;margin-bottom:12px;font-size:13.5px;line-height:1.4}
.banner.g{background:var(--green-soft);color:var(--green-ink)}.banner.a{background:var(--amber-soft);color:var(--amber-ink)}.banner.r{background:var(--red-soft);color:var(--red-ink)}.banner.b{background:var(--blue-soft);color:var(--blue-ink)}
/* pointers */
.pt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.pt:first-child{border-top:0}
.pt .ico{flex:0 0 26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.pt.do .ico{background:var(--amber-soft);color:var(--amber-ink)}.pt.watch .ico{background:var(--blue-soft);color:var(--blue-ink)}.pt.good .ico{background:var(--green-soft);color:var(--green-ink)}
/* sessions */
.sess{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.sess:first-of-type{border-top:0}
.tick{flex:0 0 40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;cursor:pointer;transition:transform .12s,background .15s}
.tick:active{transform:scale(.9)}
.tick.on{background:var(--green);border-color:var(--green)}
.sess .t{font-size:12.5px;color:var(--mute);min-width:42px;padding-top:10px;font-variant-numeric:tabular-nums}
.sess .l{flex:1;padding-top:8px}.sess .l b{font-weight:700}.sess .l div{font-size:13px;color:var(--mute);margin-top:2px}
.sess.done .l b{text-decoration:line-through;color:var(--mute)}
.kind{font-size:10.5px;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px;font-weight:700;letter-spacing:.02em}
.k-train{background:var(--green-soft);color:var(--green-ink)}.k-recover{background:var(--blue-soft);color:var(--blue-ink)}.k-task{background:var(--amber-soft);color:var(--amber-ink)}.k-habit{background:var(--violet-soft);color:var(--violet)}
.prog{height:8px;background:var(--ring);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
/* inputs */
.row{display:flex;gap:12px;align-items:center;margin:10px 0}
.row label{flex:1;font-size:14.5px}
.row output{min-width:30px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
input[type=range]{flex:1.35;accent-color:var(--green);height:32px;margin:0}
input[type=number],input[type=text],input[type=time],input[type=date],input[type=month],input[type=datetime-local],select,textarea{border:1px solid var(--line);border-radius:var(--rs);padding:10px 12px;background:var(--bg2);width:100%;min-height:44px;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fld span{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer;user-select:none;min-height:40px;display:inline-flex;align-items:center;transition:background .12s,transform .08s}
.pill:active{transform:scale(.96)}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}
.pill.on.bad{background:var(--red);border-color:var(--red)}
.pill.on.warn{background:var(--amber);border-color:var(--amber)}
.btn{border:0;border-radius:var(--rs);padding:12px 16px;min-height:46px;background:var(--green);color:#fff;font-weight:700;cursor:pointer}
.btn:active{opacity:.85}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--red);border:1px solid var(--red-soft)}
.btn.full{width:100%}
.sg{margin:12px 0 6px;font-size:13px;font-weight:700;color:var(--mute)}
.sg i{font-weight:400;font-style:normal}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--mute);font-weight:700;letter-spacing:.03em}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tl{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;margin:8px 0}
.tl button{border:0;height:30px;border-radius:7px;font-size:11px;font-weight:700;color:#fff;padding:0}
.tl button.cur{outline:3px solid var(--ink);outline-offset:1px}
.tl button.past{opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.wday{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;min-height:44px}
.wday:first-child{border-top:0}
.wday .nm{font-weight:700;min-width:96px}
.wday .ss{flex:1;font-size:13px;color:var(--mute);padding:0 8px}
.wday.today .nm{color:var(--green-ink)}
.mk{padding:11px 0;border-top:1px solid var(--line)}
.mk:first-child{border-top:0}
.mk .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mk .nm{font-weight:700}
.mk .val{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.mk .meta{font-size:12.5px;color:var(--mute)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cat{display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:32px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.kpis.two{grid-template-columns:1fr 1fr}
.kpi{background:var(--bg2);border-radius:var(--rs);padding:10px}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--mute);line-height:1.25;display:block}
.kpi .d{font-size:11.5px;font-weight:700}
.up{color:var(--green-ink)}.dn{color:var(--red-ink)}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:13px;min-height:36px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.list-item{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.list-item:first-child{border-top:0}
.x{float:right;border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;width:36px;height:36px;margin:-8px -8px 0 0}
details{background:var(--card);border-radius:var(--r);margin-bottom:12px;padding:0 16px;box-shadow:var(--shadow)}
details summary{padding:15px 0;font-weight:800;cursor:pointer;list-style:none;min-height:44px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"＋";float:right;color:var(--mute)}
details[open] summary::after{content:"－"}
details>div{padding-bottom:12px}
.dna{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.dna b{display:inline-block;min-width:64px}
.gt{font-size:12px;background:var(--bg2);border-radius:6px;padding:2px 7px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(6px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:9;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hrt{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11.5px}
.hrt .c{background:var(--bg2);border-radius:9px;padding:6px 2px}
.hrt .c.today{outline:2px solid var(--green)}
.hrt .b{display:block;margin:4px auto 0;border:1px solid var(--line);background:var(--card);border-radius:7px;width:92%;min-height:30px;line-height:28px;font-size:11.5px;cursor:pointer}
.hrt .b.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.hrt .b.sp.on{background:var(--red);border-color:var(--red)}
svg.chart{width:100%;height:auto;display:block}
.bars{display:flex;gap:6px;align-items:flex-end;height:110px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bar .st{width:100%;display:flex;flex-direction:column-reverse;gap:2px;height:84px;justify-content:flex-start}
.bar .st i{display:block;width:100%;border-radius:3px}
.bar .lb{font-size:10px;color:var(--mute);white-space:nowrap}
.streak{display:flex;align-items:center;gap:12px}
.streak .big{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1}
.empty{color:var(--mute);font-size:13.5px;padding:6px 0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="appname">Shiera's Health App</div>
    <div class="hr"><div class="wk" id="hdr-wk"></div><button class="theme" id="theme-btn" aria-label="Switch light or dark">☾</button></div>
  </div>
</header>

<main>
  <section class="page on" id="p-today"></section>
  <section class="page" id="p-plan"></section>
  <section class="page" id="p-stats"></section>
  <section class="page" id="p-bloods"></section>
  <section class="page" id="p-log"></section>
  <section class="page" id="p-me"></section>
</main>

<nav class="tabs" id="tabs">
  <button data-tab="today" class="on"><span class="ic">☀️</span>Today</button>
  <button data-tab="plan"><span class="ic">🗓️</span>Plan</button>
  <button data-tab="stats"><span class="ic">📈</span>Stats</button>
  <button data-tab="bloods"><span class="ic">🩸</span>Bloods</button>
  <button data-tab="log"><span class="ic">📝</span>Log</button>
  <button data-tab="me"><span class="ic">💚</span>Me</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ================================================================
   Shiera's Health App v2 — 26-week restoration programme
   Single file. Data stored on this device only (localStorage).
   ================================================================ */
const STORE_KEY="sha-v1";
const APP_ID="shieras-health-app";
const START="2026-11-09";           // Monday, week 1
const WEEKS=26;
const DOB="1966-01-06";

/* ---------- date helpers (local time, no UTC drift) ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d||1);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const todayISO=()=>iso(new Date());
const dow=s=>(parse(s).getDay()+6)%7;            // 0=Mon … 6=Sun
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAYS_L=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=s=>{const d=parse(s);return d.getDate()+" "+MON[d.getMonth()];};
const fmtLong=s=>DAYS_L[dow(s)]+" "+fmt(s)+" "+parse(s).getFullYear();
const fmtMonth=s=>{const[y,m]=s.split("-");return MON[Number(m)-1]+" "+y;};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const weekOf=s=>Math.floor(daysBetween(START,s)/7)+1;   // may be <1 or >26
const weekStart=w=>addDays(START,(w-1)*7);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1=n=>Math.round(n*10)/10;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

/* ---------- programme ---------- */
const PHASES=[
  {name:"Baseline", from:1, to:1, col:"#8a8f8e", what:"Measure everything. Fasting glucose draw, watch on 24/7, waist and hip, body fat, grip, 1.6 km walk test, 7-day food and symptom log."},
  {name:"Foundation", from:2, to:9, col:"#1D9E75", what:"Strength 3x, Zone 2 3x, nutrition habits set, small calorie deficit. Weeks 7–8 (21 Dec – 3 Jan) are maintenance: no loss target."},
  {name:"Build", from:10, to:17, col:"#2f6fa8", what:"Heavier strength, longer Zone 2, first interval sessions (3×3 min in weeks 10–13)."},
  {name:"Intensify", from:18, to:25, col:"#6d4fc2", what:"Weekly 4×4 intervals, strongest strength block (sets of 5–8)."},
  {name:"Retest", from:26, to:26, col:"#c9820a", what:"Repeat every baseline measure, fasting bloods, GP visit with results."},
];
const phaseOf=w=>PHASES.find(p=>w>=p.from&&w<=p.to)||null;

const SAUNA_NOTE="15–20 min. Optional short pool swim first.";
function sessionsFor(date){
  const w=weekOf(date), d=dow(date), out=[];
  const add=(id,time,label,note,kind)=>out.push({id,time,label,note,kind});
  if(w<1||w>WEEKS) return out;
  // one-off tasks
  if(w===1&&d===0) add("w1-base","06:45","Baseline measures","Weight, scales body fat, waist and hip. Enter them in Plan → Measures.","task");
  if(w===1&&d===0) add("w1-watch","","Huawei watch on 24/7","Sleep, resting HR and VO2 max from tonight.","task");
  if(w===1&&d===0) add("w1-glu","","Book fasting glucose blood draw","Gives PhenoAge a real glucose instead of the 5.2 estimate. Ask for CRP as a number too.","task");
  if(w===2&&d===0) add("w2-creat","","Start creatine 3–5 g","With breakfast. Tell your GP: it raises creatinine, so eGFR reads lower.","task");
  if(w===4&&d===0) add("w4-sterol","","Start plant sterols ~2 g","Check the label for rapeseed oil first.","task");
  if(w===26&&d===0) add("w26-base","06:45","Retest: baseline measures","Same scales, same time, same conditions as week 1.","task");
  if(w===26&&d===1) add("w26-bloods","","Fasting bloods","Fasting, same lab, morning, 5-day biotin pause, no hard session in the 24 h before.","task");
  if(w===26&&d===3) add("w26-gp","","GP visit with results","Bring the Bloods tab and the May request list.","task");
  // morning sea swim
  if(d===1||d===3) add("sea","07:15","Sea swim","A 2–3 min dip.","recover");
  // gym day
  const intervals=(d===3&&w>=10&&w<=25);

  if(d===2) add("strB","15:00","Strength B","Full body, hinge and row emphasis."+strengthNote(w),"train");
  if(d===3) add(intervals?"int":"z2","15:00",intervals?(w<=13?"Intervals 3×3":"Intervals 4×4"):"Zone 2",
      intervals?(w<=13?"10 min warm-up, then 3 min hard / 3 min easy ×3. Cross trainer, bike or rower. Inhaler with you; stop if breathing tightens.":"10 min warm-up, then 4 min hard (85–95% max HR) / 3 min easy ×4. Inhaler with you; stop if breathing tightens, chest pain or dizziness.")
      :"Cross trainer 40–45 min (bike or rower). Talk-test pace.","train");
  if(d===4) add("strC","15:00","Strength C + 10 min balance","Lighter, finishes with mobility."+strengthNote(w),"train");
  if(d<=4){const t=["16:10","16:00","16:10","16:00","16:20"][d];add("sauna",t,"Sauna",SAUNA_NOTE,"recover");}
  if(d===5){
    if(w===1||w===26) add("walktest","09:00","1.6 km walk test","Flat route, as fast as you can walk. Log time and finishing heart rate in Measures.","train");
    else add("long","09:00","Long walk, easy bike or short pool swim","60–75 min easy.","train");
  }
  if(d===6){ add("rest","","Rest day","Gentle walk; sauna optional.","recover");
    add("prep","14:00","Meal prep","Freeze salmon · roast sweet potato · hard-boil eggs · soak chia.","task");
    add("review","18:00","Week review, 20 min","Weigh-in, waist, symptoms, plan next week.","task"); }
  if(d===1||d===3||d===5) add("cold","","Cold plunge (optional)","2–3× a week, never right after lifting.","recover");
  if(d!==4) add("balance","","Balance, 10 min","Single-leg stands, step-overs, direction changes.","habit");
  add("whistle","20:00","Whistle, 20 min","5 min sight-reading · 10 min one hard tune, slow · 5 min one by ear.","habit");
  return out.sort((a,b)=>(a.time||"99")<(b.time||"99")?-1:1);
}
function strengthNote(w){
  if(w>=18) return " Intensify: heavier sets of 5–8.";
  if(w>=10) return " Build: add load when every set is clean.";
  return " 8–12 reps; add load only when every set is clean.";
}
function bannersFor(date){
  const w=weekOf(date), b=[];
  if(w<1){ b.push(["b","The programme starts Monday 9 November. Days before that show the week 1 plan so you can look ahead."]); }

  if(w>WEEKS) b.push(["g","The 26 weeks are complete. Keep logging; the data stays."]);
  return b;
}

// glucose estimates agreed in chat: July 2026 has no glucose on the report
const GLUCOSE_EST={[J]:{v:5.2,why:"estimated from your HbA1c"}};
function phenoAge(age,alb,cr,glu,crpMgL,lymPct,mcv,rdw,alp,wbc){
  const xb=-19.907-0.0336*alb+0.0095*cr+0.1953*glu+0.0954*Math.log(crpMgL/10)
    -0.0120*lymPct+0.0268*mcv+0.3306*rdw+0.00188*alp+0.0554*wbc+0.0804*age;
  const g=0.0076927;
  const M=1-Math.exp(-Math.exp(xb)*(Math.exp(120*g)-1)/g);
  return 141.50225+Math.log(-0.00553*Math.log(1-M))/0.090165;
}
function ageAt(ym){const[y,m]=ym.split("-").map(Number);const[by,bm]=DOB.split("-").map(Number);return y-by-(m<bm?1:0);}
function phenoFor(ym){
  const get=k=>(S.bloods[k]||[]).find(r=>r.date===ym);
  const need=["albumin","creat","crp","lymph","wbc","mcv","rdw","alp"];
  const missing=need.filter(k=>!get(k));
  let glu=get("glucose"),gNote="";
  if(!glu&&GLUCOSE_EST[ym]){glu={value:GLUCOSE_EST[ym].v};gNote="Glucose "+GLUCOSE_EST[ym].v+" "+GLUCOSE_EST[ym].why;}
  if(!glu) missing.push("glucose");
  if(missing.length) return {ym,missing};
  const crp=get("crp");
  const notes=[];if(gNote)notes.push(gNote);
  if(crp.q==="<") notes.push("CRP “"+fv(crp)+"” entered at its ceiling of "+crp.value.toFixed(1));
  const age=ageAt(ym);
  const v=phenoAge(age,get("albumin").value,get("creat").value,glu.value,crp.value,
    get("lymph").value/get("wbc").value*100,get("mcv").value,get("rdw").value,get("alp").value,get("wbc").value);
  return {ym,age,value:v,notes,estimated:notes.length>0};
}

const lastN=(n,end)=>{end=end||todayISO();const a=[];for(let i=n-1;i>=0;i--)a.push(addDays(end,-i));return a;};
function dayStatus(d){
  const ss=sessionsFor(d),D=dayRO(d),done=ss.filter(s=>D.done[s.id]).length;
  return {total:ss.length,done,complete:ss.length>0&&done===ss.length,sess:ss};
}
function streak(){
  const t=todayISO();let d=dayStatus(t).complete?t:addDays(t,-1),n=0;
  while(d>=START){const st=dayStatus(d);if(!st.complete)break;n++;d=addDays(d,-1);}
  return n;
}
function bestStreak(){
  const t=todayISO();let best=0,run=0;
  for(let d=START;d<=t;d=addDays(d,1)){if(dayStatus(d).complete){run++;best=Math.max(best,run);}else run=0;}
  return best;
}
function adherence(from,to){
  const t=todayISO();let total=0,done=0;
  for(let d=from;d<=to&&d<=t;d=addDays(d,1)){const st=dayStatus(d);total+=st.total;done+=st.done;}
  return {total,done,pct:total?Math.round(done/total*100):null};
}
const sessClass=id=>/^str/.test(id)?"strength":/^(z2|int|long|walktest)/.test(id)?"cardio":id==="sauna"?"sauna":id==="sea"?"swim":id==="cold"?"cold":id==="whistle"?"whistle":null;
function weekLoad(w){
  const ws=weekStart(w),out={strength:0,cardio:0,sauna:0,swim:0,cold:0,whistle:0,done:0,total:0};
  for(let i=0;i<7;i++){const d=addDays(ws,i);if(d>todayISO())break;const D=dayRO(d);
    for(const s of sessionsFor(d)){out.total++;if(D.done[s.id]){out.done++;const c=sessClass(s.id);if(c)out[c]++;}}}
  return out;
}
const series=(key,days)=>days.map(d=>{const D=S.days[d];if(!D)return null;const v=key==="weight"||key==="rhr"||key==="steps"?D.body?.[key]:D.ci?.[key];return v==null||v===""?null:[d,Number(v)];}).filter(Boolean);

function greeting(date){
  const h=new Date().getHours(),t=todayISO();
  const hi=h<12?"Morning, Shiera.":h<17?"Afternoon, Shiera.":"Evening, Shiera.";
  const w=weekOf(date),p=phaseOf(w),d=dow(date);
  if(w<1){const n=daysBetween(t,START);return {hi,line:`The programme starts <b>Monday 9 November</b>, ${n===1?"tomorrow":n+" days away"}. Here's what week 1 looks like.`,phase:"Baseline week first: measure everything."};}
  if(w>WEEKS) return {hi,line:"The 26 weeks are done. Keep logging; the habit is the result.",phase:""};
  const ss=sessionsFor(date);
  const kind=d===6?"a <b>rest day</b>":(d===3&&w>=10&&w<=25)?"an <b>intervals day</b>":[0,2,4].includes(d)?"a <b>strength day</b>":d===5?"the <b>long easy one</b>":"a <b>Zone 2 day</b>";
  const key=ss.filter(s=>s.kind==="train"||(s.kind==="task"&&/^w\d/.test(s.id))).map(s=>s.label).slice(0,3);
  const main=ss.find(s=>s.kind==="train");
  let line=`Today's ${kind}`+(main&&main.time?` — <b>${esc(main.label)}</b> at ${main.time}`:main?` — <b>${esc(main.label)}</b>`:"")+".";
  if(d<=4) line+=" Sauna after.";
  if(d===1||d===3) line=`Sea swim at 07:15, then ${line.charAt(0).toLowerCase()+line.slice(1)}`;
  const extras=ss.filter(s=>s.kind==="task"&&/^w\d/.test(s.id)).map(s=>s.label);
  if(extras.length) line+=` Also today: ${extras.map(esc).join("; ")}.`;
  return {hi,line,phase:`Week ${w} of 26 · ${p.name}${w===7||w===8?" · maintenance, no loss target":""}`};
}
const CHEER_FULL=[
  "Every box ticked. That's the whole plan done, and you did it. Go on with yourself.",
  "Clean sweep. Not a thing left on the list.",
  "All done. Your mast cells won't know what's hit them.",
  "That's a full day in the bank. Lock it.",
  "Done and dusted. Nothing skipped, nothing fudged.",
  "Full house. Steady burn, exactly as written.",
];
const CHEER_REST=["Rest day done properly. That's training too.","Rested, prepped, reviewed. That's how Sunday earns its keep."];
const CHEER_WEEK="Seven for seven. A full week with nothing missed: that's what a steady burn looks like.";
function cheer(date){
  const st=dayStatus(date);if(!st.total)return null;
  const D=dayRO(date),isToday=date===todayISO();
  if(st.complete){
    const sk=streak();
    let msg;
    const wd=dow(date);
    if(wd===6&&lastN(7,date).every(d=>dayStatus(d).complete)) msg=CHEER_WEEK;
    else if(wd===6) msg=CHEER_REST[daysBetween(START,date)%CHEER_REST.length];
    else msg=CHEER_FULL[daysBetween(START,date)%CHEER_FULL.length];
    if(isToday&&sk>=3) msg+=` <b>${sk} days straight.</b>`;
    if(isToday&&[7,14,21,30,50,75,100].includes(sk)) msg+=" That's a milestone, and you earned every one of them.";
    return {cls:"",msg};
  }
  const left=st.sess.filter(s=>!D.done[s.id]);
  const h=new Date().getHours();
  if(st.done===0){
    if(!isToday) return null;
    return h>=18?{cls:"part",msg:"Nothing ticked yet. Even the whistle counts; get one in."}:null;
  }
  if(left.length===1) return {cls:"part",msg:`One left: <b>${esc(left[0].label)}</b>. Finish it.`};
  if(st.done>=st.total/2) return {cls:"part",msg:`Over halfway: ${st.done} of ${st.total}. Still to go: ${left.map(s=>esc(s.label)).join(", ")}.`};
  return {cls:"part",msg:`${st.done} of ${st.total} done. Next up: <b>${esc(left[0].label)}</b>.`};
}
function pointers(){
  const t=todayISO(),w=weekOf(t),P=[];
  const add=(lvl,txt)=>P.push({lvl,txt});
  if(w<1) return P;
  const d7=lastN(7),d14=lastN(14);
  const ci=k=>d7.map(d=>S.days[d]?.ci?.[k]).filter(v=>v!=null);
  const last3=lastN(3).map(d=>S.days[d]?.ci?.energy).filter(v=>v!=null);
  // energy / recovery
  if(last3.length===3&&last3.every(v=>v<5)) add("do","Three low-energy mornings in a row. Scale back: walk or rebound instead of the hard session, and look at the trigger log and food notes for a cause.");
  else if(S.days[t]?.ci?.energy!=null&&S.days[t].ci.energy<5&&sessionsFor(t).some(s=>s.kind==="train")) add("do","Energy under 5 this morning: swap today's hard session for a walk or the rebounder. The old rule stands.");
  const gut2=lastN(2).map(d=>S.days[d]?.ci?.gut).filter(v=>v!=null);
  if(gut2.length===2&&gut2.every(v=>v<5)) add("do","Gut comfort low two days running. DGL and zinc carnosine before meals, rocket and olive oil first, and check what's new in the food notes.");
  const breathBad=d7.filter(d=>["wheeze","inhaler"].includes(S.days[d]?.ci?.breath)).length;
  if(breathBad>=2) add("do",`Breathing flagged ${breathBad} mornings this week. Check the trigger log, ease the Zone 2 pace, and keep the inhaler in the gym bag.`);
  const mouth=d7.filter(d=>(S.days[d]?.ci?.flags||[]).includes("mouth")).length;
  if(mouth>=3) add("watch",`Mouth breathing ${mouth} nights this week. Nasal strips or mouth tape tonight; dehumidifier on while you're out.`);
  // triggers
  if(S.triggers.some(x=>x.date===t)) add("do","Trigger logged today: ginger tea, light dinner, skip the cold plunge, and sauna only if breathing is clear.");
  // sleep
  const sl=ci("sleepH");if(sl.length>=4&&avg(sl)<7) add("watch",`Sleep averaging ${r1(avg(sl))} h over the week. Target is 7–8: bed by 22:30, screens off at 21:00, lemon balm last thing.`);
  // resting HR
  const rhrNow=d7.map(d=>S.days[d]?.body?.rhr).filter(v=>v),rhrPrev=lastN(7,addDays(t,-7)).map(d=>S.days[d]?.body?.rhr).filter(v=>v);
  if(rhrNow.length>=4&&rhrPrev.length>=4&&avg(rhrNow)-avg(rhrPrev)>=5) add("watch",`Resting HR is up ${Math.round(avg(rhrNow)-avg(rhrPrev))} bpm on last week. Under-recovery or something brewing: make today easy and watch it.`);
  // weight
  const wt=series("weight",d14);
  if(wt.length>=6&&w>=2&&w!==7&&w!==8&&w<26){
    const first=avg(wt.slice(0,Math.ceil(wt.length/2)).map(p=>p[1])),last=avg(wt.slice(Math.floor(wt.length/2)).map(p=>p[1]));
    const chg=last-first;
    if(chg>=-0.1) add("watch","Weight hasn't moved in two weeks. Review the calorie target at Sunday's review; the aim is 0.1–0.2 kg a week, nothing dramatic.");
    else if(chg<=-0.9) add("watch","Losing faster than 0.2 kg a week. Add 100–150 kcal: the plan is fat off, lean mass held.");
  }
  // training load this week
  const L=weekLoad(w);
  if(dow(t)>=2&&L.strength+L.cardio>L.sauna+1) add("watch",`${L.strength+L.cardio} gym sessions, ${L.sauna} saunas this week. The plan is sauna after every gym visit.`);
  if(dow(t)>=4&&L.strength<2) add("watch",`Only ${L.strength} strength session${L.strength===1?"":"s"} ticked by ${DAYS_L[dow(t)]}. Kettlebells at home count if the gym doesn't fit.`);
  // treats, steps
  if(treatsInWeek(t)>2) add("watch",`${treatsInWeek(t)} treats this week; the plan is two. No drama, just back to two next week.`);
  const st=d7.map(d=>S.days[d]?.body?.steps).filter(v=>v);
  if(st.length>=4&&avg(st)<7000) add("watch",`Steps averaging ${Math.round(avg(st)/100)*100} a day. Target is 7,000–10,000: a walk break in the work block does it.`);
  // measures & baseline
  const lastM=[...S.measures].sort((a,b)=>a.date<b.date?1:-1)[0];
  if(w===1&&dow(t)>=2&&!lastM) add("do","Baseline measures still blank. Weight, body fat, waist and hip in Plan → Measures; they anchor everything in May.");
  else if(lastM&&daysBetween(lastM.date,t)>=28&&w<26) add("do",`Measures are due: the last set was ${daysBetween(lastM.date,t)} days ago. Same scales, same time of day.`);
  // supplements starting
  if(w===2&&dow(t)===0) add("do","Creatine starts today, 3–5 g with breakfast. Tell your GP: creatinine rises, so eGFR reads lower.");
  if(w===4&&dow(t)===0) add("do","Plant sterols start today, about 2 g with your main meal. Label-check for rapeseed oil first.");
  // backup
  const lb=S.settings.lastBackup;
  if(Object.keys(S.days).length>=5&&(!lb||daysBetween(lb,t)>=14)) add("watch",lb?`Last backup ${daysBetween(lb,t)} days ago. Me → Data, 10 seconds.`:"No backup yet. Me → Data, 10 seconds, and your log survives a phone mishap.");
  // May prep
  if(w===25) add("do","Retest week is next. Book the fasting bloods for Tuesday 4 May and the GP for later that week.");
  // good
  const sk=streak();
  if(!P.length&&sk>=3) add("good",`Nothing to flag. ${sk} days straight; the plan is working because you're working it.`);
  else if(!P.length) add("good","Nothing to flag. Keep going.");
  return P;
}

const toSec=s=>{if(!s)return null;const p=String(s).split(":").map(Number);return p.length===2&&!p.some(isNaN)?p[0]*60+p[1]:null;};

function latestPheno(){
  const dates=[...new Set(Object.values(S.bloods).flat().map(r=>r.date))].filter(d=>d>="2026-07").sort();
  for(let i=dates.length-1;i>=0;i--){const r=phenoFor(dates[i]);if(r.value)return r;}
  return null;
}
function status(m,r){
  if(!r)return"none";const v=r.value;
  if(m.good==="low"){if(m.hi==null)return"none";if(r.q==="<"&&v<=m.hi)return"good";return v<=m.hi?"good":(v<=m.hi*1.15?"watch":"bad");}
  if(m.good==="high"){if(m.lo==null)return"none";if(r.q===">"&&v>=m.lo)return"good";return v>=m.lo?"good":(v>=m.lo*0.85?"watch":"bad");}
  if(m.lo!=null&&v<m.lo)return v>=m.lo*0.9?"watch":"bad";
  if(m.hi!=null&&v>m.hi)return v<=m.hi*1.1?"watch":"bad";
  return"good";
}

const SCOL={good:"var(--green)",watch:"var(--amber)",bad:"var(--red)",none:"var(--line)"};

  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline fill="none" stroke="var(--mute)" stroke-width="1.5" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ")}"/><circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.5" fill="var(--ink)"/></svg>`;
}

function showTab(t){
  UI.tab=t;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));

document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)showTab(b.dataset.tab);});

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,D=()=>day(UI.date);
  switch(a){
    case"tab":e.preventDefault();showTab(el.dataset.t);break;
    case"day":UI.date=addDays(UI.date,Number(el.dataset.n));renderToday();break;
    case"gotoday":UI.date=todayISO();renderToday();break;
    case"sess":{const d=D();const was=dayStatus(UI.date).complete;d.done[el.dataset.id]=!d.done[el.dataset.id];save();buzz();
      const now=dayStatus(UI.date).complete;renderToday(now&&!was);renderHeader();
      if(now&&!was){buzz([20,40,20]);if(UI.date===todayISO())toast(streak()>=3?`🔥 ${streak()} days straight`:"All done today ✓",2200);}break;}
    case"breath":{const d=D();d.ci.breath=d.ci.breath===el.dataset.v?null:el.dataset.v;save();renderToday();break;}
    case"ciflag":{const d=D(),f=d.ci.flags||(d.ci.flags=[]),k=el.dataset.k,i=f.indexOf(k);i<0?f.push(k):f.splice(i,1);save();renderToday();break;}
    case"habit":{const d=D();d.habits[el.dataset.k]=!d.habits[el.dataset.k];save();buzz(8);renderToday();break;}
    case"supp":{const d=D();d.supps[el.dataset.k]=!d.supps[el.dataset.k];save();buzz(8);renderToday();break;}
    case"pweek":e.preventDefault();UI.planWeek=Number(el.dataset.w);renderPlan();break;
    case"openday":UI.date=el.dataset.d;showTab("today");break;
    case"addmeasure":addMeasure();break;
    case"delmeasure":if(confirm("Delete this measures entry?")){S.measures=S.measures.filter(m=>m.id!==el.dataset.id);save();renderPlan();}break;
    case"srange":UI.statRange=Number(el.dataset.n);renderStats();break;
    case"smetric":UI.statMetric=el.dataset.k;renderStats();break;
    case"cat":{const c=el.dataset.c;UI.openCats.has(c)?UI.openCats.delete(c):UI.openCats.add(c);renderBloods();break;}
    case"addblood":addBlood();break;
    case"logsub":UI.logSub=el.dataset.k;renderLog();break;
    case"trigtype":UI.trigType=UI.trigType===el.dataset.k?null:el.dataset.k;el.parentNode.querySelectorAll(".pill").forEach(p=>p.classList.toggle("on",p.dataset.k===UI.trigType));break;
    case"trigsys":{const k=el.dataset.k;UI.trigSys.has(k)?UI.trigSys.delete(k):UI.trigSys.add(k);el.classList.toggle("on");break;}
    case"addtrig":addTrigger();break;
    case"deltrig":if(confirm("Delete this trigger entry?")){S.triggers=S.triggers.filter(t=>t.id!==el.dataset.id);save();renderLog();}break;
    case"antieff":el.parentNode.querySelectorAll(".pill").forEach(p=>p.classList.toggle("on",p===el&&!p.classList.contains("on")));break;
    case"addanti":addAnti();break;
    case"delanti":if(confirm("Delete this entry?")){S.anti=S.anti.filter(x=>x.id!==el.dataset.id);save();renderLog();}break;
    case"hrtwk":{const t=todayISO();UI.hrtWeek=addDays(UI.hrtWeek||addDays(t,-dow(t)),Number(el.dataset.n));renderLog();break;}
    case"hrt":{const d=el.dataset.d,k=el.dataset.k,r=S.hrt[d]||(S.hrt[d]={});r[k]=!r[k];if(!r.patch&&!r.ve)delete S.hrt[d];save();buzz(8);renderLog();break;}
    case"spot":{const d=el.dataset.d,i=S.spotting.indexOf(d);i<0?S.spotting.push(d):S.spotting.splice(i,1);save();renderLog();break;}
    case"mesub":UI.meSub=el.dataset.k;renderMe();break;
    case"theme":S.settings.theme=el.dataset.k;save();applyTheme();renderMe();break;
    case"export":exportBackup();break;
    case"reset":if(confirm("Erase everything you've logged on this phone? This can't be undone.")&&confirm("Really erase? Download a backup first if you might want it.")){S=freshState();save();applyTheme();toast("Erased");render();}break;
  }
});

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function addMeasure(){
  const g=id=>document.getElementById(id).value.trim();
  const m={id:uid(),date:g("m-date")||todayISO()};
  let any=false;
  for(const[k]of MFIELDS){const v=g("m-"+k);if(v!==""){m[k]=k==="walk"?v:Number(v);any=true;}}
  if(m.walk!=null&&toSec(m.walk)==null){toast("Walk time as mm:ss, e.g. 15:30");return;}
  if(!any){toast("Enter at least one measure");return;}
  S.measures.push(m);save();toast("Measures saved");renderPlan();
}
function addBlood(){
  const key=document.getElementById("b-key").value,date=document.getElementById("b-date").value,val=document.getElementById("b-val").value,q=document.getElementById("b-q").value;
  if(!date||val===""||isNaN(Number(val))){toast("Pick a month and enter a number");return;}
  const rows=S.bloods[key]||(S.bloods[key]=[]);
  const i=rows.findIndex(r=>r.date===date);const rec={date,value:Number(val),q};
  if(i>=0)rows[i]=rec;else rows.push(rec);
  rows.sort((a,b)=>a.date<b.date?-1:1);
  UI.openCats.add(MK[key].cat);save();toast(MK[key].name+" saved");renderBloods();
}
function addTrigger(){
  const g=id=>document.getElementById(id).value.trim();
  if(!UI.trigType&&!g("t-what")){toast("Pick a type or describe it");return;}
  const at=g("t-at"),sym=g("t-sym");
  let delay=null;if(at&&sym){delay=(toSec(sym)-toSec(at));if(delay<0)delay+=1440;}
  S.triggers.push({id:uid(),date:g("t-date")||todayISO(),at,sym,delay,type:UI.trigType||"other",what:g("t-what"),systems:[...UI.trigSys],sev:Number(g("t-sev")),tx:g("t-tx"),rec:g("t-rec")});
  UI.trigType=null;UI.trigSys=new Set();save();toast("Trigger logged");renderLog();
}
function addAnti(){
  const eff=document.querySelector("#a-eff .pill.on");
  const when=document.getElementById("a-when").value;
  if(!when){toast("Add the time");return;}
  S.anti.push({id:uid(),which:document.getElementById("a-which").value,when,why:document.getElementById("a-why").value.trim(),eff:eff?eff.dataset.k:""});
  save();toast("Logged");renderLog();
}
function exportBackup(){
  const data=JSON.stringify({app:APP_ID,version:2,exported:new Date().toISOString(),data:S},null,1);
  const blob=new Blob([data],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="shieras-health-backup-"+todayISO()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  S.settings.lastBackup=todayISO();save();toast("Backup downloaded");renderMe();
}
function importBackup(input){
  const f=input.files[0];if(!f)return;const msg=document.getElementById("restore-msg");
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const b=JSON.parse(rd.result);
      if(b.app!==APP_ID||!b.data||!b.data.days) throw new Error("not a backup from this app");
      if(!confirm("Replace everything on this phone with the backup from "+(b.exported||"?").slice(0,10)+"?")){input.value="";return;}
      S=b.data;
      const f=freshState();for(const k of Object.keys(f)) if(S[k]===undefined) S[k]=f[k];
      save();applyTheme();
      msg.textContent="✓ Restored: "+Object.keys(S.days).length+" days, "+S.triggers.length+" triggers, "+S.measures.length+" measures.";msg.style.color="var(--green-ink)";
    }catch(err){msg.textContent="Couldn't restore: "+err.message+". Old Histamine Tracker backups can't be loaded here.";msg.style.color="var(--red-ink)";}
    input.value="";
  };
  rd.readAsText(f);
}

/* ---------- start ---------- */
load();applyTheme();
const qd=new URLSearchParams(location.search).get("date");if(qd&&/^\d{4}-\d{2}-\d{2}$/.test(qd))UI.date=qd;
render();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const t=todayISO();if(UI.date<t&&UI._last!==t){UI.date=t;}UI._last=t;render();}});
UI._last=todayISO();
if("serviceWorker"in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
